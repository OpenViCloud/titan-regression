name: CI

# Tests of the suite's tooling only: the lib helpers that run without Playwright (selftest/) and the report and
# log scripts. The specs themselves need a running environment and run in the cluster's runner, not here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # titan-ops is private, so a link into it is a 404 for every reader of this repository; a titan-ops doc is named
      # `titan-ops <path under its docs/>#<anchor>` instead.
      - name: No URL into private titan-ops
        run: |
          if git grep -n -I -i -E 'github\.com/openvicloud/titan-ops([^[:alnum:]_-]|$)' -- ':/'; then
            echo "URL into private titan-ops above: write titan-ops <path>#<anchor>"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Selftest (lib helpers)
        run: node --test 'selftest/*.test.ts'

      - name: count-cases.py
        run: python3 test_count_cases.py

      - name: check-screenshots.py
        run: python3 test_check_screenshots.py

      - name: trim-cp-log.py
        run: python3 test_trim_cp_log.py

      - name: patch-job.py
        run: python3 test_patch_job.py

      - name: run-lanes.py
        run: python3 test_run_lanes.py && python3 run-lanes.py --check
